<text class="eyebrow" x="72" y="62">图 2 · 组成</text>
<text class="title" x="72" y="106">agent 由五部分组成，部分之间有三条边界</text>
<text class="sub" x="72" y="146">接入层、运行时、执行环境是通常说的三层；模型服务和会话状态同样影响部署位置</text>
