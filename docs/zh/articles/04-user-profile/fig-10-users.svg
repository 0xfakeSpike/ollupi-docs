<text class="f" x="80" y="864">图 10 · Attentive 2026 年 8 月调查，3054 名美国成年人</text>
<text class="f" x="1520" y="864" text-anchor="end">AI 时代到来，你的用户画像的价值会被谁赚走？</text>
