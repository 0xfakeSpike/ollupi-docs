<text class="q" x="116.0" y="352.0" text-anchor="start">Network reachability</text>
<text class="lab" x="116.0" y="378.0" text-anchor="start">The runtime must reach the model</text>
<path d="M478,357 H704" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="944.0" y="222.0" width="524.0" height="100.0" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="q" x="964.0" y="256.0" text-anchor="start">Security isolation · fault isolation</text>
<text class="lab" x="964.0" y="282.0" text-anchor="start">Keys and approvals stay away from execution</text>
<text class="lab" x="964.0" y="306.0" text-anchor="start">Execution failures don't take the runtime down</text>
<path d="M1034,328 L1016,398" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="96.0" y="580.0" width="300.0" height="76.0" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="q" x="116.0" y="614.0" text-anchor="start">Access and identity</text>
<text class="lab" x="116.0" y="640.0" text-anchor="start">Toward where users already are</text>
<path d="M246,578 V490" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="560.0" y="580.0" width="300.0" height="76.0" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="q" x="580.0" y="614.0" text-anchor="start">Uptime</text>
<text class="lab" x="580.0" y="640.0" text-anchor="start">Toward always-on machines</text>
<path d="M710,578 V490" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1168.0" y="580.0" width="300.0" height="76.0" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
<text class="q" x="1188.0" y="614.0" text-anchor="start">Resource location</text>
<text class="lab" x="1188.0" y="640.0" text-anchor="start">Toward the resources</text>
<path d="M1318,578 V490" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="96.0" y="720.0" width="1372.0" height="100.0" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text class="q" x="120.0" y="758.0" text-anchor="start">Idle cost</text>
<text class="lab" x="260.0" y="758.0" text-anchor="start">The parts live on different clocks: shared runtime, on-demand execution, clients that come and go</text>
<text class="q" x="120.0" y="796.0" text-anchor="start">Compliance</text>
<text class="lab" x="260.0" y="796.0" text-anchor="start">Pulls the other way: if data can't leave a boundary, every part, the model included, goes inside it</text>
</svg>
