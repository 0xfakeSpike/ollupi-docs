<text class="eyebrow" x="72" y="62">FIG. 5 · FORCES</text>
<text class="title" x="72" y="106">Each force pulls on one part, so the parts come apart</text>
<text class="sub" x="72" y="146">Seven forces, each acting on one layer or on the boundary between two</text>
<line x1="72" y1="850" x2="1528" y2="850" stroke="#e2e8f0" stroke-width="2"/>
<text class="foot" x="72" y="882">Each force is discussed in section 3</text>
<text class="foot" x="1528" y="882" text-anchor="end">Head in the Cloud, Hands at Home</text>
