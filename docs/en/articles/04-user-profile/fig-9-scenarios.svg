<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs><marker id="aS" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#64748b"/></marker><marker id="aI" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f46e5"/></marker><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f43f5e"/></marker><marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0d9488"/></marker><marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ec4899"/></marker></defs>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; } .t { font-size: 56px; font-weight: 800; } .k { font-size: 44px; font-weight: 800; } .n { font-size: 88px; font-weight: 800; } .m { font-size: 34px; font-weight: 700; } .b { font-size: 30px; fill: #334155; } .s { font-size: 26px; fill: #64748b; } .f { font-size: 22px; fill: #94a3b8; }</style>
<rect width="1600" height="900" fill="#ffffff"/>
<text class="t" x="80" y="118" style="font-size:42.1px">Will platforms let AI in? Will AI get cheap? Three outcomes</text>
<text class="f" x="80" y="864">Fig. 9 · Inference; the outcomes will coexist across industries and regions</text>
<text class="f" x="1520" y="864" text-anchor="end">AI Knows You Better Than Ever. Who Gets Paid for It?</text>
<rect x="230.0" y="180.0" width="630.0" height="250.0" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
<text class="k" x="270.0" y="256.0" text-anchor="start">Pay to skip the ads</text>
<text class="b" x="270.0" y="324.0" text-anchor="start">Free AI shows ads; its picks</text>
<text class="b" x="270.0" y="360.0" text-anchor="start">may favor sellers who paid</text>
<rect x="884.0" y="180.0" width="630.0" height="250.0" rx="16" fill="#fdf2f8" stroke="#ec4899" stroke-width="3"/>
<text class="k" x="924.0" y="256.0" text-anchor="start">Your agent shops</text>
<text class="k" x="924.0" y="306.0" text-anchor="start">around for you</text>
<text class="b" x="924.0" y="374.0" text-anchor="start">It can go into any platform;</text>
<text class="b" x="924.0" y="410.0" text-anchor="start">your profile moves with you</text>
<rect x="230.0" y="454.0" width="630.0" height="250.0" rx="16" fill="#f0fdfa" stroke="#0d9488" stroke-width="3"/>
<text class="k" x="270.0" y="530.0" text-anchor="start">Each platform lets in</text>
<text class="k" x="270.0" y="580.0" text-anchor="start">only its own AI</text>
<text class="b" x="270.0" y="648.0" text-anchor="start">Outside AI is kept out; you buy</text>
<text class="b" x="270.0" y="684.0" text-anchor="start">where your AI lives</text>
<rect x="884.0" y="454.0" width="630.0" height="250.0" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="3" stroke-dasharray="12 9"/>
<text class="k" x="924.0" y="530.0" text-anchor="start" style="fill:#64748b">Open platforms,</text>
<text class="k" x="924.0" y="580.0" text-anchor="start" style="fill:#64748b">costly AI</text>
<text class="b" x="924.0" y="648.0" text-anchor="start">Only a few can afford it;</text>
<text class="b" x="924.0" y="684.0" text-anchor="start">likely a passing stage</text>
<circle cx="242" cy="763" r="12" fill="#f43f5e"/>
<text class="s" x="266.0" y="772.0" text-anchor="start" style="fill:#f43f5e">China is closer to the bottom left today</text>
<path d="M230,728 H1514" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" marker-end="url(#aS)"/>
<text class="s" x="1514.0" y="772.0" text-anchor="end">The more platforms let outside AI in</text>
<path d="M200,704 V180" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" marker-end="url(#aS)"/>
<text class="s" x="180.0" y="442.0" text-anchor="middle" transform="rotate(-90 180 442.0)">Cheaper AI</text>
</svg>
