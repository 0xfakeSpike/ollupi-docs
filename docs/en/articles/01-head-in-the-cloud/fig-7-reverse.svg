<rect x="383.6" y="317.0" width="76.9" height="29.0" rx="6" fill="#ffffff" stroke="none" stroke-width="2"/>
<text class="s" x="422.0" y="336.0" text-anchor="middle">③ Allow</text>
<text class="s" x="420.0" y="492.0" text-anchor="middle">No inbound port; works without a public IP</text>
