<style>text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; } .eyebrow { font-size: 16px; font-weight: 600; letter-spacing: 3px; fill: #4f46e5; } .title { font-size: 36px; font-weight: 700; } .sub { font-size: 19px; fill: #64748b; } .h { font-size: 22px; font-weight: 700; } .hs { font-size: 19px; font-weight: 600; } .q { font-size: 18px; font-weight: 700; } .b { font-size: 17px; fill: #334155; } .s { font-size: 15px; fill: #64748b; } .zt { font-size: 16px; font-weight: 600; fill: #64748b; letter-spacing: 1px; } .lab { font-size: 16px; fill: #334155; } .chip { font-size: 15px; font-weight: 600; } .chipb { font-size: 18px; font-weight: 700; } .foot { font-size: 15px; fill: #94a3b8; }</style>
<rect width="1600" height="620" fill="#ffffff"/>
<text class="eyebrow" x="72" y="62">FIG. 7 · INVERTED CONTROL</text>
<text class="title" x="72" y="106">When the runtime is in the cloud, enforce permissions locally</text>
<text class="sub" x="72" y="146">The local side dials out and the cloud sends instructions. If the runtime is injected, the local check is the last defense</text>
<line x1="72" y1="560" x2="1528" y2="560" stroke="#e2e8f0" stroke-width="2"/>
<text class="foot" x="72" y="592">Applies to topology 5 and to the overseas-server setup in fig. 1</text>
<text class="foot" x="1528" y="592" text-anchor="end">Head in the Cloud, Hands at Home</text>
<rect x="72.0" y="200.0" width="700.0" height="320.0" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text class="zt" x="92.0" y="230.0" text-anchor="start">User's computer</text>
<rect x="940.0" y="200.0" width="588.0" height="320.0" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text class="zt" x="960.0" y="230.0" text-anchor="start">Cloud</text>
<rect x="104.0" y="280.0" width="270.0" height="114.0" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
<rect x="104.0" y="280.0" width="270.0" height="48.0" rx="12" fill="#ec4899" stroke="none" stroke-width="2"/>
<rect x="104.0" y="316.0" width="270.0" height="12.0" rx="0" fill="#ec4899" stroke="none" stroke-width="2"/>
<text class="hs" x="239.0" y="311.0" text-anchor="middle" style="fill:#ffffff">Execution environment</text>
<text class="lab" x="239.0" y="354.0" text-anchor="middle">Browser, files</text>
<text class="lab" x="239.0" y="380.0" text-anchor="middle">Logged-in sessions</text>
<rect x="470.0" y="280.0" width="270.0" height="140.0" rx="12" fill="#1e1b4b" stroke="none" stroke-width="2"/>
<text class="hs" x="605.0" y="338.0" text-anchor="middle" style="fill:#ffffff">Permission check</text>
<text class="lab" x="605.0" y="370.0" text-anchor="middle" style="fill:#c7d2fe">Enforced locally</text>
<rect x="1010.0" y="280.0" width="448.0" height="114.0" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<rect x="1010.0" y="280.0" width="448.0" height="48.0" rx="12" fill="#4f46e5" stroke="none" stroke-width="2"/>
<rect x="1010.0" y="316.0" width="448.0" height="12.0" rx="0" fill="#4f46e5" stroke="none" stroke-width="2"/>
<text class="hs" x="1234.0" y="311.0" text-anchor="middle" style="fill:#ffffff">Runtime</text>
<text class="lab" x="1234.0" y="354.0" text-anchor="middle">Takes tasks, calls the model</text>
<text class="lab" x="1234.0" y="380.0" text-anchor="middle">Issues tool calls</text>
<rect x="1010.0" y="440.0" width="219.4" height="34.0" rx="8" fill="#334155" stroke="none" stroke-width="2"/>
<text class="chip" x="1119.7" y="462.4" text-anchor="middle" style="fill:#ffffff">May be prompt-injected</text>
<path d="M742,310 H1008" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="788.1" y="276.0" width="173.8" height="30.0" rx="6" fill="#ffffff" stroke="none" stroke-width="2"/>
<text class="lab" x="875.0" y="296.0" text-anchor="middle">① Local dials out</text>
<path d="M1008,390 H744" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="802.0" y="356.0" width="145.9" height="30.0" rx="6" fill="#ffffff" stroke="none" stroke-width="2"/>
<text class="lab" x="875.0" y="376.0" text-anchor="middle">② Instructions</text>
