<rect width="1600" height="860" fill="#ffffff"/>
<text class="eyebrow" x="72" y="62">图 5 · 形态 2 与形态 3</text>
<text class="title" x="72" y="106">Cowork 把 agent 循环移出了虚拟机</text>
<text class="sub" x="72" y="146">调整前，运行时、凭证和代码执行在同一个虚拟机里；调整后，虚拟机里只剩代码执行</text>
