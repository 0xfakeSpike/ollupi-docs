<text class="eyebrow" x="72" y="62">FIG. 2 · THE PARTS</text>
<text class="title" x="72" y="106">An agent has five parts and three boundaries</text>
<text class="sub" x="72" y="146">The usual three layers, plus the model service and session state, which also shape where things run</text>
