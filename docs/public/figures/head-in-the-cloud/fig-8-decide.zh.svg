<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/></marker><marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f46e5"/></marker><marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f43f5e"/></marker></defs>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; } .eyebrow { font-size: 16px; font-weight: 600; letter-spacing: 3px; fill: #4f46e5; } .title { font-size: 36px; font-weight: 700; } .sub { font-size: 19px; fill: #64748b; } .h { font-size: 22px; font-weight: 700; } .hs { font-size: 19px; font-weight: 600; } .q { font-size: 18px; font-weight: 700; } .b { font-size: 17px; fill: #334155; } .s { font-size: 15px; fill: #64748b; } .zt { font-size: 16px; font-weight: 600; fill: #64748b; letter-spacing: 1px; } .lab { font-size: 16px; fill: #334155; } .chip { font-size: 15px; font-weight: 600; } .chipb { font-size: 18px; font-weight: 700; } .foot { font-size: 15px; fill: #94a3b8; }</style>
<rect width="1600" height="1060" fill="#ffffff"/>
<text class="eyebrow" x="72" y="62">图 8 · 选型</text>
<text class="title" x="72" y="106">四个问题，选出部署形态</text>
<text class="sub" x="72" y="146">从上往下回答；「是」向右，「否」向下</text>
<line x1="72" y1="1000" x2="1528" y2="1000" stroke="#e2e8f0" stroke-width="2"/>
<text class="foot" x="72" y="1032">企业场景把接入层换成企业 IM 即为形态 7；通用桌面助手可同时连接多个执行环境（形态 8）</text>
<text class="foot" x="1528" y="1032" text-anchor="end">水在青天云在瓶：agent 的身首错位现象</text>
<rect x="120.0" y="200.0" width="640.0" height="64.0" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text class="q" x="440.0" y="240.0" text-anchor="middle">数据必须留在企业内网？</text>
<path d="M762,232.0 H896" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowI)"/>
<rect x="814.5" y="201.0" width="31.0" height="29.0" rx="6" fill="#ffffff" stroke="none" stroke-width="2"/>
<text class="s" x="830.0" y="220.0" text-anchor="middle">是</text>
<rect x="900.0" y="194.0" width="628.0" height="76.0" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text class="q" x="920.0" y="226.0" text-anchor="start">私有化部署</text>
<text class="s" x="920.0" y="252.0" text-anchor="start">接入层、运行时、执行环境和模型都在内网</text>
<path d="M440.0,266 V326" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text class="s" x="468.0" y="303.0" text-anchor="middle">否</text>
<rect x="120.0" y="330.0" width="640.0" height="64.0" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text class="q" x="440.0" y="370.0" text-anchor="middle">资源能复制到云端，且任务要并行或离线继续？</text>
<path d="M762,362.0 H896" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowI)"/>
<rect x="814.5" y="331.0" width="31.0" height="29.0" rx="6" fill="#ffffff" stroke="none" stroke-width="2"/>
<text class="s" x="830.0" y="350.0" text-anchor="middle">是</text>
<rect x="900.0" y="324.0" width="628.0" height="76.0" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text class="q" x="920.0" y="356.0" text-anchor="start">4  云端托管</text>
<text class="s" x="920.0" y="382.0" text-anchor="start">换来并行和离线继续；付出本地资源和控制权</text>
<path d="M440.0,396 V456" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text class="s" x="468.0" y="433.0" text-anchor="middle">否</text>
<rect x="120.0" y="460.0" width="640.0" height="64.0" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text class="q" x="440.0" y="500.0" text-anchor="middle">任务比设备在线时间长，或要从手机派任务？</text>
<path d="M762,492.0 H896" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowI)"/>
<rect x="814.5" y="461.0" width="31.0" height="29.0" rx="6" fill="#ffffff" stroke="none" stroke-width="2"/>
<text class="s" x="830.0" y="480.0" text-anchor="middle">是</text>
<rect x="900.0" y="460.0" width="628.0" height="64.0" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text class="q" x="1214.0" y="500.0" text-anchor="middle">常开的运行时由谁提供？</text>
<path d="M1052.0,526 V580" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1014.0" y="539.0" width="76.0" height="29.0" rx="6" fill="#ffffff" stroke="none" stroke-width="2"/>
<text class="s" x="1052.0" y="558.0" text-anchor="middle">用户自己</text>
<rect x="900.0" y="584.0" width="304.0" height="76.0" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text class="q" x="920.0" y="616.0" text-anchor="start">6  远程接入 + 本地运行时</text>
<text class="s" x="920.0" y="642.0" text-anchor="start">自己维护一台常开设备</text>
<path d="M1376.0,526 V580" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1353.0" y="539.0" width="46.0" height="29.0" rx="6" fill="#ffffff" stroke="none" stroke-width="2"/>
<text class="s" x="1376.0" y="558.0" text-anchor="middle">厂商</text>
<rect x="1224.0" y="584.0" width="304.0" height="76.0" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text class="q" x="1244.0" y="616.0" text-anchor="start">5  云端运行时 + 本地执行</text>
<text class="s" x="1244.0" y="642.0" text-anchor="start">权限检查放在本地</text>
<path d="M440.0,526 V716" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text class="s" x="468.0" y="628.0" text-anchor="middle">否</text>
<rect x="120.0" y="720.0" width="640.0" height="64.0" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text class="q" x="440.0" y="760.0" text-anchor="middle">希望 agent 自动运行，不逐条审批？</text>
<path d="M762,752.0 H896" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowI)"/>
<rect x="814.5" y="721.0" width="31.0" height="29.0" rx="6" fill="#ffffff" stroke="none" stroke-width="2"/>
<text class="s" x="830.0" y="740.0" text-anchor="middle">是</text>
<rect x="900.0" y="714.0" width="628.0" height="76.0" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text class="q" x="920.0" y="746.0" text-anchor="start">3  本地运行时 + 隔离执行</text>
<text class="s" x="920.0" y="772.0" text-anchor="start">凭证留在隔离区外；执行环境出错不影响运行时</text>
<path d="M440.0,786 V846" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<text class="s" x="468.0" y="823.0" text-anchor="middle">否</text>
<rect x="120.0" y="850.0" width="640.0" height="76.0" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
<text class="q" x="140.0" y="882.0" text-anchor="start">1  全本地</text>
<text class="s" x="140.0" y="908.0" text-anchor="start">零部署、零额外延迟；设备离线任务就停</text>
</svg>
