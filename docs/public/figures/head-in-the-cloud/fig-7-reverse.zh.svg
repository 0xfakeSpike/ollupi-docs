<rect x="104.0" y="316.0" width="270.0" height="12.0" rx="0" fill="#ec4899" stroke="none" stroke-width="2"/>
<text class="hs" x="239.0" y="311.0" text-anchor="middle" style="fill:#ffffff">执行环境</text>
<text class="lab" x="239.0" y="354.0" text-anchor="middle">浏览器、文件</text>
<text class="lab" x="239.0" y="380.0" text-anchor="middle">登录状态</text>
<rect x="470.0" y="280.0" width="270.0" height="140.0" rx="12" fill="#1e1b4b" stroke="none" stroke-width="2"/>
<text class="hs" x="605.0" y="338.0" text-anchor="middle" style="fill:#ffffff">权限检查</text>
<text class="lab" x="605.0" y="370.0" text-anchor="middle" style="fill:#c7d2fe">最终在本地执行</text>
<rect x="1010.0" y="280.0" width="448.0" height="114.0" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<rect x="1010.0" y="280.0" width="448.0" height="48.0" rx="12" fill="#4f46e5" stroke="none" stroke-width="2"/>
<rect x="1010.0" y="316.0" width="448.0" height="12.0" rx="0" fill="#4f46e5" stroke="none" stroke-width="2"/>
<text class="hs" x="1234.0" y="311.0" text-anchor="middle" style="fill:#ffffff">运行时</text>
<text class="lab" x="1234.0" y="354.0" text-anchor="middle">接收任务、调用模型</text>
<text class="lab" x="1234.0" y="380.0" text-anchor="middle">发出工具调用</text>
<rect x="1010.0" y="440.0" width="133.0" height="34.0" rx="8" fill="#334155" stroke="none" stroke-width="2"/>
